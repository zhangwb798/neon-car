<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c111b"><title>指尖赛车 · Neon Circuit</title><link rel="stylesheet" href="style.css"></head>
<body><canvas id="game" aria-label="赛车赛道"></canvas><header><a class="brand" href="./">◈ <span>指尖赛车<small>NEON CIRCUIT</small></span></a><div class="wallet">◉ <b id="coins">0</b><span>金币</span></div><button id="sound" class="icon" aria-label="切换音效">音效 关</button></header>
<div id="hud" hidden><div class="hudBox"><small id="trackName"></small><strong id="timer">00.00</strong></div><div class="hudRight"><span id="progress">0 / 1 圈</span><button id="pause" class="icon">暂停</button><button id="restart" class="icon">重来</button></div><div id="raceHint">跟随路标，到达终点</div><div id="speed"><b>0</b><small>KM/H</small></div></div>
<main id="menu"><div class="intro"><div class="eyebrow">TOUCH. TURN. DRIFT.</div><h1>弯道之间，<br>尽在<span>指尖。</span></h1><p>跟随镜头，征服下一道弯。<br>滑动摇杆加速转向，在霓虹赛道留下你的轨迹。</p><div class="actions"><button class="primary" id="start">开始驾驶</button><button id="shopBtn" class="secondary">车库 <span>18</span></button></div><div class="instructions"><span>◉ 拖动屏幕操控</span><span>⌨ WASD / 方向键</span><span>␣ 空格漂移</span></div></div>
<section class="trackPanel"><div class="sectionLabel">选择赛道 <span>SELECT CIRCUIT</span></div><div id="tracks"></div><div class="legend"><i></i> 极简赛道 · 自由漂移 · 计时挑战</div></section><footer><span>独立竞速实验 / 001</span><span>用速度，画出你的路线。</span></footer></main>
<div id="overlay" hidden><section class="modal"><div class="eyebrow" id="resultLabel"></div><h2 id="resultTitle"></h2><div id="resultBody"></div><div class="modalActions"><button class="primary" id="continue">再跑一圈</button><button class="secondary" id="back">返回赛道</button></div></section></div>
<div id="garage" hidden><section class="modal"><div class="eyebrow">YOUR COLLECTION</div><h2>车库 <span>车漆商店</span></h2><p>完赛赚取金币，自由搭配车身、轮胎印与拖尾。</p><div id="skins"></div><button class="secondary" id="closeShop">返回</button></section></div><div id="toast" role="status"></div><script src="game.js"></script></body></html>
